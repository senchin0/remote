name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 静默全局安装 WPS Office（所有用户可用）
        shell: pwsh
        run: |
          $installerUrl = "https://wdl1.pcfg.cache.wpscdn.com/wpsdl/wpsoffice/download/12.2.0.23196/500.1001/WPSOffice_23196.exe"
          $installerName = "WPSOffice_23196.exe"
          Write-Host "下载WPS安装包"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerName -UseBasicParsing

          Write-Host "执行全局静默安装，等待完成..."
          $proc = Start-Process -FilePath .\$installerName -ArgumentList "/S" -Wait -NoNewWindow -PassThru
          Write-Host "安装程序退出码：$($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            throw "WPS安装程序返回失败"
          }

          Start-Sleep -Seconds 120
          $wpsPath = "C:\Program Files\Kingsoft\WPS Office\wps.exe"
          if (-not (Test-Path $wpsPath)){
            throw "校验失败，找不到全局WPS"
          }
          Write-Host "✅ WPS全局安装完成，vum用户也可以使用"

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      - name: Install Tailscale
        shell: pwsh
        run: .github/workflows/scripts/win-install-tailscale.ps1

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
