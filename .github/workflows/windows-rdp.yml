name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 原生ODT安装Microsoft 365
        shell: pwsh
        run: |
          # 下载ODT工具
          Write-Host "下载 Office Deployment Tool"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/2/7/A/27ABC108-7877-4668-BEFA-C7D408CD30B0/setup.exe" -OutFile ODT-setup.exe -UseBasicParsing
          
          # 写入ODT配置xml
          $xml = @'
<Configuration>
  <Add OfficeClientEdition="64" Channel="Current">
    <Product ID="O365ProPlusRetail">
      <Language ID="zh-CN" />
    </Product>
  </Add>
  <Display Level="None" AcceptEULA="TRUE" />
  <Property Name="FORCEAPPSHUTDOWN" Value="TRUE"/>
  <Property Name="AUTOACTIVATE" Value="0"/>
</Configuration>
'@
          $xml | Out-File -FilePath .\config.xml -Encoding UTF8

          Write-Host "开始下载+安装Office，等待进程完成..."
          $proc = Start-Process -FilePath .\ODT-setup.exe -ArgumentList "/configure config.xml" -Wait -NoNewWindow -PassThru
          Write-Host "ODT退出码：$($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            throw "ODT安装失败，退出码 $($proc.ExitCode)"
          }

          # 校验Word程序
          $wordPath = "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE"
          if (Test-Path $wordPath) {
            Write-Host "✅ 校验成功，WINWORD.EXE 已存在"
          } else {
            throw "❌ 找不到 WINWORD.EXE，安装失败"
          }

      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      - name: Install Tailscale
        shell: pwsh
        run: .github/workflows/scripts/win-install-tailscale.ps1

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
